<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D2F35C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hangul Master">
<title>Hangul Master — Bahasa Korea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --hutan: #163300;
  --hutan-2: #2A4A12;
  --teks-2: #454745;
  --muted: #6F7369;
  --lime: #9FE870;
  --lime-2: #8BD95A;
  --neon: #D2F35C;
  --neon-soft: #F1FBD0;
  --bg: #F2F3EE;
  --kartu: #FFFFFF;
  --abu: #E8EAE3;
  --abu-2: #DCDFD5;
  --garis: #E3E5DD;
  --pink: #FAD4F2;
  --pink-2: #F3B5E5;
  --mint: #E3F5D9;
  --krem: #F6F1E4;
  --merah: #D2483E;
  --merah-soft: #FCE6E3;
  --papan: #DDEBD9;
  --nav-bg: #22301A;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
  background: #E9EEE4;
  color: var(--hutan);
  height: 100%;
  overflow-x: hidden;
}
.kr { font-family: 'Noto Sans KR', sans-serif; }
.anton { font-family: 'Anton', sans-serif; letter-spacing: 0.5px; line-height: 0.92; text-transform: uppercase; }
.unbounded { font-family: 'Unbounded', sans-serif; }

/* DESKTOP STAGE & LEFT PANEL */
.stage {
  display: flex;
  min-height: 100dvh;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 32px;
}
.side-panel {
  width: 300px;
  background: var(--kartu);
  border-radius: 28px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(22,51,0,0.08);
  border: 1px solid var(--garis);
  flex-shrink: 0;
}
.side-panel h2 { font-family: 'Unbounded', sans-serif; font-size: 20px; margin: 0 0 6px; }
.side-panel p { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
.side-btn {
  width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--garis);
  background: var(--bg); color: var(--hutan); font-weight: 700; font-size: 13px;
  cursor: pointer; text-align: left; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  transition: all 0.2s;
}
.side-btn:hover { background: var(--neon-soft); border-color: var(--lime); }
.side-btn.active { background: var(--hutan); color: var(--neon); border-color: var(--hutan); }

/* PHONE FRAME */
.phone-frame {
  width: 390px;
  height: 844px;
  background: #111;
  border-radius: 56px;
  padding: 12px;
  box-shadow: 0 30px 70px rgba(22,51,0,0.22), inset 0 0 0 2px #333;
  position: relative;
  flex-shrink: 0;
}
.phone-notch {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 28px; background: #111; border-radius: 20px; z-index: 50;
}
.phone-screen {
  width: 100%; height: 100%;
  background: var(--bg);
  border-radius: 47px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

@media (max-width: 560px) {
  .stage { padding: 0; }
  .side-panel, .phone-notch { display: none !important; }
  .phone-frame {
    width: 100vw; height: 100dvh; border-radius: 0; padding: 0; background: var(--bg); box-shadow: none;
  }
  .phone-screen { border-radius: 0; }
}

/* BOARD MODE (SEMUA SKRIN) */
body.board-mode .stage { display: block; padding: 32px; background: var(--papan); }
body.board-mode .phone-frame { display: none; }
body.board-mode .side-panel { width: 100%; max-width: 1200px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; }
.board-grid {
  display: none; max-width: 1200px; margin: 0 auto;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 24px;
}
body.board-mode .board-grid { display: grid; }
.mini-wrap { text-align: center; }
.mini-phone {
  width: 232px; height: 502px; background: #111; border-radius: 34px; padding: 7px; margin: 0 auto 10px;
  box-shadow: 0 14px 28px rgba(22,51,0,0.15); cursor: pointer; transition: transform 0.25s;
}
.mini-phone:hover { transform: translateY(-6px); }
.mini-screen {
  width: 390px; height: 844px; transform: scale(0.56); transform-origin: top left;
  background: var(--bg); border-radius: 44px; overflow: hidden; pointer-events: none;
}

/* SCREEN VIEWPORT */
.app-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 46px 18px 104px;
  scroll-behavior: smooth;
  animation: fadeSlide 0.35s ease;
}
.app-body.no-pad { padding: 0; }
.app-body::-webkit-scrollbar { width: 4px; }
.app-body::-webkit-scrollbar-thumb { background: var(--abu-2); border-radius: 10px; }

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* TYPOGRAPHY & COMMON UI */
.kicker { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h1.title { font-size: 26px; font-weight: 800; margin: 4px 0; line-height: 1.2; }
h2.sec-title { font-size: 19px; font-weight: 800; margin: 0; }
h3.card-title { font-size: 15px; font-weight: 800; margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 12px 20px; border-radius: 999px; border: none;
  font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  transition: transform 0.15s, background 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn-lime { background: var(--lime); color: var(--hutan); }
.btn-lime:hover { background: var(--lime-2); }
.btn-dark { background: var(--hutan); color: var(--neon); }
.btn-abu { background: var(--abu); color: var(--hutan); }
.btn-merah { background: var(--merah-soft); color: var(--merah); }
.btn-full { width: 100%; }

.pill-input {
  width: 100%; height: 48px; border-radius: 999px; border: 1.5px solid var(--garis);
  background: var(--kartu); padding: 0 18px; font-family: inherit; font-size: 14px; color: var(--hutan);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.pill-input:focus { border-color: var(--hutan); box-shadow: 0 0 0 4px var(--neon-soft); }

/* FLOATING NAV */
.floating-nav {
  position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  background: var(--nav-bg); padding: 7px 10px; border-radius: 999px;
  display: flex; gap: 10px; box-shadow: 0 14px 30px rgba(22,51,0,0.28); z-index: 40;
}
.nav-btn {
  width: 48px; height: 48px; border-radius: 999px; border: none;
  background: transparent; color: #A6B59E; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
}
.nav-btn.active {
  background: var(--neon); color: var(--hutan); transform: scale(1.06);
}

/* SPLASH & ONBOARDING */
.splash-view {
  height: 100%; background: var(--neon); display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 24px;
}
.splash-logo { font-size: 36px; font-weight: 700; animation: springPop 0.8s cubic-bezier(.2,1.4,.4,1); }
@keyframes springPop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.loader-bar { width: 64px; height: 4px; background: rgba(22,51,0,0.15); border-radius: 99px; margin-top: 20px; overflow: hidden; }
.loader-fill { height: 100%; width: 0%; background: var(--hutan); animation: loadFill 2.1s ease forwards; }
@keyframes loadFill { to { width: 100%; } }

/* WELCOME ORBIT */
.orbit-box {
  width: 240px; height: 240px; margin: 16px auto 24px; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.orbit-core {
  width: 112px; height: 112px; border-radius: 999px;
  background: linear-gradient(135deg, #B6EE8E, #9FE870, #8ADB5C);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 18px 34px rgba(22,51,0,0.16); z-index: 2;
}
.orbit-ring {
  position: absolute; inset: 0; border: 1.5px dashed var(--abu-2); border-radius: 999px;
  animation: spinOrbit 22s linear infinite;
}
@keyframes spinOrbit { to { transform: rotate(360deg); } }
.orbit-chip {
  position: absolute; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
  box-shadow: 0 8px 20px rgba(22,51,0,0.1); animation: counterSpin 22s linear infinite;
}
@keyframes counterSpin { to { transform: rotate(-360deg); } }

/* CARDS & BANNERS */
.banner-card {
  border-radius: 20px; padding: 20px; position: relative; overflow: hidden;
  transition: all 0.3s;
}
.bento-card {
  background: var(--kartu); border-radius: 18px; padding: 16px; border: 1px solid var(--garis);
  transition: transform 0.15s;
}
.bento-card:active { transform: scale(0.98); }

/* 3D STUDENT CARD */
.student-card {
  background: linear-gradient(135deg, #B6EE8E 0%, #9FE870 50%, #8ADB5C 100%);
  border-radius: 22px; padding: 20px; color: var(--hutan);
  box-shadow: 0 18px 34px rgba(22,51,0,0.16); position: relative; overflow: hidden;
  transition: transform 0.3s ease;
}
.student-card::after {
  content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
  transform: rotate(25deg); animation: sheen 3.5s infinite;
}
@keyframes sheen { 0% { left: -60%; } 40%, 100% { left: 130%; } }

/* STROKE CANVAS & BOX */
.stroke-grid {
  background-color: var(--kartu);
  background-image: linear-gradient(to right, var(--garis) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--garis) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 2px solid var(--hutan);
  border-radius: 20px;
}

/* QUIZ & FEEDBACK SHEET */
.quiz-opt {
  width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px;
  border: 1.5px solid var(--garis); background: var(--kartu);
  font-family: inherit; font-size: 14px; font-weight: 700; color: var(--hutan);
  cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.15s;
}
.quiz-opt.selected { border-color: var(--hutan); background: var(--neon); }
.quiz-opt.wrong { border-color: var(--merah); background: var(--merah-soft); color: #8A2A22; animation: shake 0.35s; }
.quiz-opt.correct { border-color: #3C9B3A; background: var(--mint); }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.feedback-sheet {
  position: absolute; bottom: 0; left: 0; right: 0;
  border-radius: 26px 26px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 30px rgba(22,51,0,0.14); z-index: 45;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* TOAST & CONFETTI */
.toast {
  position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
  background: var(--hutan); color: var(--neon); padding: 10px 18px;
  border-radius: 999px; font-size: 12px; font-weight: 700; z-index: 60;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2); white-space: nowrap;
}
#confetti-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 55; }

/* BLUR MEANING */
.blur-text { filter: blur(5px); cursor: pointer; transition: filter 0.25s; user-select: none; }
.blur-text.revealed { filter: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="stage">
  <!-- PANEL KIRI DESKTOP -->
  <aside class="side-panel" id="sidePanel">
    <div>
      <h2>한 Hangul Master</h2>
      <p>Edisi Reka Bentuk Tinggi · Belajar Bahasa Korea dengan nota lengkap, dialog & kuiz interaktif.</p>
    </div>
    <div id="sideControls">
      <button class="side-btn active" id="btnModeApp" onclick="toggleBoard(false)">
        <span>📱 Mod Aplikasi Interaktif</span><span>→</span>
      </button>
      <button class="side-btn" id="btnModeBoard" onclick="toggleBoard(true)">
        <span>🎨 Semua Skrin (Papan UI)</span><span>→</span>
      </button>
      <div style="height:1px; background:var(--garis); margin:14px 0;"></div>
      <div class="kicker" style="margin-bottom:8px;">Pintasan Skrin</div>
      <button class="side-btn" onclick="go('home')"><span>🏠 Beranda Utama</span></button>
      <button class="side-btn" onclick="go('intro')"><span>📖 Pengenalan & Jadual Huruf</span></button>
      <button class="side-btn" onclick="go('writing')"><span>✍️ Writing Lab (Kanvas)</span></button>
      <button class="side-btn" onclick="go('words')"><span>📚 Kamus Indeks (800+ Kata)</span></button>
      <button class="side-btn" onclick="go('listen')"><span>🎧 Mod Dengar Audio</span></button>
      <button class="side-btn" onclick="go('progress')"><span>📊 Progres & Lencana</span></button>
    </div>
  </aside>

  <!-- BINGKAI TELEFON 390x844 -->
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="phoneScreen">
      <canvas id="confetti-canvas" width="390" height="844"></canvas>
      <div id="appRoot" style="height:100%; display:flex; flex-direction:column;"></div>
      <div id="navMount"></div>
      <div id="toastMount"></div>
    </div>
  </div>

  <!-- PAPAN SEMUA SKRIN (DESKTOP) -->
  <div class="board-grid" id="boardGrid"></div>
</div>

<script>

function flowerSVG(color) {
  let petals = '';
  for (let i = 0; i < 8; i++) {
    petals += `<ellipse cx="50" cy="20" rx="11" ry="20" fill="${color}" opacity="0.65" transform="rotate(${i*45} 50 50)"/>`;
  }
  return `<svg width="96" height="96" viewBox="0 0 100 100" style="position:absolute; right:-14px; bottom:-14px; pointer-events:none;">${petals}<circle cx="50" cy="50" r="14" fill="#163300"/></svg>`;
}

/* ================= DATA PENUH HANGUL MASTER ================= */
const visualEmojiMap = {
  "사과":"🍎","고양이":"🐱","물":"💧","커피":"☕","집":"🏠","책":"📚","개":"🐶","새":"🐦","돈":"💵","달":"🌙",

let S = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem('hangul-master-v2');
    if (raw) {
      const parsed = JSON.parse(raw);
      return { ...DEFAULT_STATE, ...parsed, screen: parsed.nama ? 'home' : 'splash' };
    }
  } catch (e) {}
  return { ...DEFAULT_STATE };
}
function saveState() {
  try { localStorage.setItem('hangul-master-v2', JSON.stringify(S)); } catch (e) {}
}

/* AUDIO & SOUND */
function clickSound() {
  if (!S.bunyi) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  } catch (e) {}
}

function speakKR(txt) {
  clickSound();
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ko-KR';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {
    toast(S.lang === 'ms' ? 'Audio dimainkan: ' + txt : 'Playing audio: ' + txt);
  }
}

function toast(msg) {
  const m = document.getElementById('toastMount');
  if (!m) return;
  m.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(() => { if (m) m.innerHTML = ''; }, 2400);
}

function addXP(amt) {
  S.xp += amt;
  S.xpHari[6] = (S.xpHari[6] || 0) + amt;
  saveState();
}

/* NAVIGATION */
function go(scr, extra = {}) {
  clickSound();
  Object.assign(S, extra, { screen: scr });
  saveState();
  render();
}

function toggleLang() {
  S.lang = S.lang === 'ms' ? 'en' : 'ms';
  clickSound();
  saveState();
  render();
}

function t(ms, en) { return S.lang === 'ms' ? ms : en; }

/* ================= RENDER SCREENS ================= */
function render() {
  const root = document.getElementById('appRoot');
  const nav = document.getElementById('navMount');
  const showNavScreens = ['home', 'progress', 'words', 'profile'];

  if (showNavScreens.includes(S.screen)) {
    nav.innerHTML = `
      <nav class="floating-nav" aria-label="Navigasi Utama">
        <button class="nav-btn ${S.screen==='home'?'active':''}" onclick="go('home')" aria-label="Beranda">${ICONS.home}</button>
        <button class="nav-btn ${S.screen==='progress'?'active':''}" onclick="go('progress')" aria-label="Progres">${ICONS.chart}</button>
        <button class="nav-btn ${S.screen==='words'?'active':''}" onclick="go('words')" aria-label="Kamus">${ICONS.book}</button>
        <button class="nav-btn ${S.screen==='profile'?'active':''}" onclick="go('profile')" aria-label="Profil">${ICONS.user}</button>
      </nav>`;
  } else {
    nav.innerHTML = '';
  }

  switch (S.screen) {
    case 'splash': renderSplash(root); break;
    case 'onboarding': renderOnboarding(root); break;
    case 'welcome': renderWelcome(root); break;
    case 'login': renderLogin(root); break;
    case 'register': renderRegister(root); break;
    case 'home': renderHome(root); break;
    case 'intro': renderIntro(root); break;
    case 'writing': renderWriting(root); break;
    case 'listen': renderListen(root); break;
    case 'topic': renderTopic(root); break;
    case 'quiz': renderQuiz(root); break;
    case 'result': renderResult(root); break;
    case 'progress': renderProgress(root); break;
    case 'words': renderWords(root); break;
    case 'profile': renderProfile(root); break;
    case 'notif': renderNotif(root); break;
    case 'edit': renderEdit(root); break;
    default: renderHome(root);
  }
}

/* 7. QUIZ & RESULT */
function startQuiz(modId) {
  const pool = modId === 'random'
    ? ALL_WORDS
    : (ALL_MODULES.find(m => m.id === modId)?.items || ALL_WORDS);
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 5);
  const questions = shuffled.map(item => {
    const distractors = ALL_WORDS.filter(w => w.desc !== item.desc).sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.desc);
    const opts = [item.desc, ...distractors].sort(() => Math.random() - 0.5);
    return { item, opts, answer: item.desc };
  });
  S.quiz = { modId, idx: 0, score: 0, questions, selected: null, checked: false };
  go('quiz');
}

function selectQuizOpt(opt) {
  clickSound();

function checkQuiz() {
  const qz = S.quiz;
  qz.checked = true;
  if (qz.selected === qz.questions[qz.idx].answer) {
    qz.score++;
    addXP(10);
  }
  render();
}
function nextQuiz() {
  const qz = S.quiz;
  if (qz.idx < 4) {
    qz.idx++;
    qz.selected = null;
    qz.checked = false;
    render();
  } else {
    if (qz.modId !== 'random') {
      const prev = S.skor[qz.modId] || 0;
      if (qz.score > prev) S.skor[qz.modId] = qz.score;
    }
    S.riwayat.unshift({ modId: qz.modId, score: qz.score, date: new Date().toLocaleDateString() });
    if (S.riwayat.length > 30) S.riwayat.pop();
    saveState();
    go('result');
    if (qz.score >= 4) fireConfetti();
  }
}

let wCtx = null, wDraw = false;
function setupWriteCanvas() {
  const c = document.getElementById('writeCanvas');
  if (!c) return;
  wCtx = c.getContext('2d');
  wCtx.strokeStyle = '#163300';
  wCtx.lineWidth = 6;
  wCtx.lineCap = 'round';
  wCtx.lineJoin = 'round';
  const pos = e => {
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left)*(c.width/r.width), y: (t.clientY - r.top)*(c.height/r.height) };
  };
  const start = e => { if(e.touches) e.preventDefault(); wDraw = true; const p = pos(e); wCtx.beginPath(); wCtx.moveTo(p.x, p.y); };
  const move = e => { if(!wDraw) return; if(e.touches) e.preventDefault(); const p = pos(e); wCtx.lineTo(p.x, p.y); wCtx.stroke(); };
  const end = () => { wDraw = false; };
  c.onmousedown = start; c.onmousemove = move; c.onmouseup = end; c.onmouseleave = end;
  c.ontouchstart = start; c.ontouchmove = move; c.ontouchend = end;
}
function clearWriteCanvas() {
  const c = document.getElementById('writeCanvas');
  if (c && wCtx) wCtx.clearRect(0, 0, c.width, c.height);
}

/* 13. PROFILE, NOTIF & EDIT */

  const badges = [
    { name: t('Langkah Pertama','First Step'), ok: S.xp > 0, ico:'🌱' },
    { name: t('Nilai Sempurna','Perfect 5/5'), ok: Object.values(S.skor).some(v => v===5), ico:'🏆' },
    { name: t('100 XP Terkumpul','100 XP Club'), ok: S.xp >= 100, ico:'⚡' },
    { name: t('5 Modul Selesai','5 Modules Done'), ok: done >= 5, ico:'🔥' },
    { name: t('Rajin Membaca','Bookworm'), ok: Object.keys(S.dibuka).length >= 3, ico:'📖' },
    { name: t('Master Hangul','Hangul Master'), ok: done >= 15, ico:'👑' }

  root.innerHTML = `
    <div class="app-body" style="padding-top:0;">

        <span class="unbounded" style="font-size:18px; font-weight:700; color:var(--hutan);">${t('Profil','Profile')}</span>
      </div>
      <div style="margin-top:-44px; text-align:center; margin-bottom:18px;">

        <h1 class="title" style="font-size:22px;">${S.nama || 'Pelajar Hangul'}</h1>

      </div>

        ${badges.map(b => `

function renderEdit(root) {
  root.innerHTML = `
    <div class="app-body">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
        <button onclick="go('profile')" style="width:42px; height:42px; border-radius:99px; border:1px solid var(--garis); background:var(--kartu); display:flex; align-items:center; justify-content:center; cursor:pointer;">${ICONS.back}</button>
        <h1 class="title" style="font-size:22px;">${t('Edit Akaun','Edit Account')}</h1>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <label class="kicker">${t('NAMA PELAJAR','STUDENT NAME')}</label>

        <input id="edKelas" class="pill-input" value="${S.kelas}">
        <label class="kicker">${t('BUNYI KLIK','CLICK SOUND')}</label>
        <button class="btn btn-abu" onclick="S.bunyi=!S.bunyi; saveState(); render();">${S.bunyi ? '🔊 Hidup (ON)' : '🔇 Senyap (OFF)'}</button>
        <button class="btn btn-lime btn-full" onclick="saveEdit()">${t('Simpan Perubahan','Save Changes')}</button>
        <button class="btn btn-merah btn-full" onclick="resetProg()">${t('Set Semula Semua Progres','Reset All Progress')}</button>
      </div>
    </div>`;
}
function saveEdit() {
  const n = document.getElementById('edNama').value.trim();
  const k = document.getElementById('edKelas').value.trim();
  if (n) S.nama = n;
  if (k) S.kelas = k;
  saveState();
  toast(t('Tetapan disimpan!','Settings saved!'));
  go('profile');
}
function resetProg() {
  S.xp = 0; S.skor = {}; S.dibuka = {}; S.riwayat = [];
  saveState();
  toast(t('Semua progres telah diset semula.','All progress has been reset.'));
  go('profile');
}

/* BOARD MODE (ALL SCREENS PREVIEW) */
function toggleBoard(enable) {
  document.body.classList.toggle('board-mode', enable);
  document.getElementById('btnModeApp').classList.toggle('active', !enable);
  document.getElementById('btnModeBoard').classList.toggle('active', enable);
  if (enable) renderBoard();
}
function renderBoard() {
  const grid = document.getElementById('boardGrid');
  const screens = [
    ['1. Splash','splash'],['2. Onboarding','onboarding'],['3. Sambut','welcome'],
    ['4. Log Masuk','login'],['5. Beranda','home'],['6. Nota Huruf','intro'],
    ['7. Writing Lab','writing'],['8. Topik Materi','topic'],['9. Kuiz','quiz'],
    ['10. Progres','progress'],['11. Kamus','words'],['12. Profil','profile']
  ];
  grid.innerHTML = screens.map(([label, scr]) => `
    <div class="mini-wrap">
      <div class="mini-phone" onclick="toggleBoard(false); go('${scr}')">
        <div class="mini-screen" id="mini-${scr}"></div>
      </div>
      <div style="font-size:13px; font-weight:800;">${label}</div>
    </div>`).join('');

  const backup = { ...S };
  S.nama = S.nama || 'Aina Sofea';
  S.xp = Math.max(S.xp, 240);
  S.activeModId = 'lvl-1';
  if (!S.quiz) S.quiz = { modId:'lvl-1', idx:0, score:4, questions:[{item:levelsData[0].items[0], opts:['Bunyi a seperti Ayam','Bunyi o bulat','Susu','Doktor'], answer:'Bunyi a seperti Ayam'}], selected:'Bunyi a seperti Ayam', checked:false };

  screens.forEach(([, scr]) => {
    const el = document.getElementById('mini-' + scr);
    if (!el) return;
    S.screen = scr;
    const temp = document.createElement('div');
    temp.style.height = '100%';
    if (scr==='splash') renderSplash(temp);
    else if (scr==='onboarding') renderOnboarding(temp);
    else if (scr==='welcome') renderWelcome(temp);
    else if (scr==='login') renderLogin(temp);
    else if (scr==='home') renderHome(temp);
    else if (scr==='intro') renderIntro(temp);
    else if (scr==='writing') renderWriting(temp);
    else if (scr==='topic') renderTopic(temp);
    else if (scr==='quiz') renderQuiz(temp);
    else if (scr==='progress') renderProgress(temp);
    else if (scr==='words') renderWords(temp);
    else if (scr==='profile') renderProfile(temp);
    el.appendChild(temp);
  });
  S = backup;
}

/* CONFETTI */
function fireConfetti() {
  const c = document.getElementById('confetti-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const pieces = Array.from({length: 65}, () => ({
    x: Math.random()*390, y: -20 - Math.random()*200,
    w: 8, h: 6, vy: 2 + Math.random()*4, vx: -2 + Math.random()*4,
    col: ['#9FE870','#D2F35C','#FAD4F2','#163300','#8FC6EE'][Math.floor(Math.random()*5)]
  }));
  let frame = 0;
  function step() {
    ctx.clearRect(0,0,390,844);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x, p.y, p.w, p.h);
    });
    if (++frame < 130) requestAnimationFrame(step);
    else ctx.clearRect(0,0,390,844);
  }
  requestAnimationFrame(step);
}

/* INIT */
render();
</script>
